  <title id="tytul">Koszt w tokenach: polski, angielski i kod</title>
  <desc id="opis">Ten sam akapit zapisany po polsku zajmuje 76 tokenów przy 210 znakach, czyli 2,8 znaku na token. Po angielsku ta sama treść to 206 znaków i 41 tokenów, czyli 5,0 znaku na token. Próbka kodu w Pythonie: 166 znaków i 53 tokeny, czyli 3,1 znaku na token. Polski kosztuje około 1,8 raza więcej tokenów niż angielski. Pomiar na modelu llama3.2; qwen2.5-coder:14b daje 73, 40 i 52 tokeny.</desc>

